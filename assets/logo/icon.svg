<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Polaroid4yo">
  <!-- Background card -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="#FBF7F0" stroke="#2B2622" stroke-width="14"/>

  <!-- Polaroid photo area -->
  <rect x="104" y="104" width="304" height="228" rx="26" fill="url(#photoGradient)"/>

  <!-- Flash / lens dot -->
  <circle cx="256" cy="200" r="62" fill="#FBF7F0" opacity="0.92"/>

  <!-- Polaroid caption bar -->
  <rect x="176" y="372" width="160" height="26" rx="13" fill="#2B2622"/>

  <defs>
    <linearGradient id="photoGradient" x1="104" y1="104" x2="408" y2="332" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3C9D2"/>
      <stop offset="0.5" stop-color="#DAD3F2"/>
      <stop offset="1" stop-color="#C3E4F2"/>
    </linearGradient>
  </defs>
</svg>
